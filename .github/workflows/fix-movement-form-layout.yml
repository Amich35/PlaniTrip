name: Fix movement form layout
on:
  push:
    paths:
      - .github/workflows/fix-movement-form-layout.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply mobile layout patch
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/planitrip.patch
          git apply --check /tmp/planitrip.patch
          git apply /tmp/planitrip.patch
          git rm .github/workflows/fix-movement-form-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: contain movement form fields on mobile"
          git push origin main
