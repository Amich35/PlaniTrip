name: PlaniTrip commit 9 patch

on:
  push:
    branches: [pt-commit9-temp]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pt-commit9-temp
          fetch-depth: 0
      - run: python3 .github/pt_commit9_patch.py
      - run: rm .github/pt_commit9_patch.py .github/workflows/pt-commit9-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Etape 5 (Programme) - commit 9: modifier une activite depuis Programme"
          git push origin HEAD:pt-commit9-temp
