name: Apply P0.8 Patch 2 city dates
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08-p2-city-dates.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch city date inline save
        env:
          REPLACEMENT_B64: 
        run: |
          python -c "import os,re,base64,pathlib; p=pathlib.Path('index.html'); s=p.read_text(encoding='utf-8'); pat=r'function editCityDateRange\(ck, startVal, endVal\)\{.*?\n\}(?=\n// Dates réelles)'; m=re.search(pat,s,re.S); assert m, 'editCityDateRange block not found'; rep=base64.b64decode(os.environ['REPLACEMENT_B64']).decode(); s=s[:m.start()]+rep+s[m.end():]; old=\"    editCityDateRange(countryId+'_'+newCity.city, dateStart, dateEnd);\"; new=\"    await editCityDateRange(countryId+'_'+newCity.city, dateStart, dateEnd);\"; assert old in s, 'create-city date call not found'; s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')"
          git diff --check
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p08-p2-city-dates.yml
          git add index.html
          git diff --cached --check
          git commit -m "fix(P0.8/2): make inline city dates server-first"
          git push
