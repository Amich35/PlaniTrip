name: Apply P1-A favorite rollback
on:
  push:
    branches: [main]
    paths: [.github/workflows/p1a-favorite-rollback.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch toggleFavorite
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"function toggleFavorite\(k\)\{.*?\n\}\nfunction toggleCity"
          m = re.search(pattern, s, flags=re.S)
          if not m:
              raise SystemExit('toggleFavorite block not found')

          replacement = r'''async function toggleFavorite(k){
  if(!S.favorites) S.favorites={};
  if(!toggleFavorite._inFlight) toggleFavorite._inFlight={};
  if(toggleFavorite._inFlight[k]) return false;

  var hadKey = Object.prototype.hasOwnProperty.call(S.favorites,k);
  var previous = !!S.favorites[k];
  var next = !previous;
  S.favorites[k]=next;
  save();
  renderContent();

  // Offline-first : sans session Supabase exploitable, conserver le comportement local existant.
  // En ligne, l'update reste optimiste mais doit rollbacker si Supabase refuse l'écriture.
  if(!sb || !CURRENT_TRIP || !CURRENT_TRIP.id) return true;

  toggleFavorite._inFlight[k]=true;
  try{
    var countryId = k.split('_')[0];
    var r;
    if(next){
      var who=(CURRENT_USER&&PROFILES_MAP[CURRENT_USER.email])||(CURRENT_USER&&CURRENT_USER.email)||'';
      r = await sb.from('favorites').insert({trip_id:CURRENT_TRIP.id,key:k,country_id:countryId,added_by_label:who});
    } else {
      r = await sb.from('favorites').delete().eq('trip_id',CURRENT_TRIP.id).eq('key',k);
    }
    if(r && r.error) throw r.error;
    return true;
  } catch(err){
    console.error('[PlaniTrip] favorite sync error:',err);
    if(hadKey) S.favorites[k]=previous;
    else delete S.favorites[k];
    save();
    renderContent();
    toast('Impossible de modifier le favori');
    return false;
  } finally {
    delete toggleFavorite._inFlight[k];
  }
}
function toggleCity'''
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1a-favorite-rollback.yml
          git add index.html
          git diff --cached --check
          git commit -m "fix(P1-A): rollback favorite on Supabase failure"
          git push