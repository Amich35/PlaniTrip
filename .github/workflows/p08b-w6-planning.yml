name: Apply P0.8-B W6 planning
on:
  push:
    branches:
      - gpt/p08b-w6-planning
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch W6 planning
        run: python .github/scripts/p08b_w6_planning.py
      - name: Validate
        run: |
          git diff --check
          test "$(grep -c "detail_key:'__planitrip__actDate'.*data:_blobOnly(S.actDate)" index.html || true)" -eq 0
          test "$(grep -c "detail_key:'__planitrip__actMoment'.*data:_blobOnly(S.actMoment)" index.html || true)" -eq 0
          test "$(grep -c "detail_key:'__planitrip__actTimeStart'.*data:_blobOnly(S.actTimeStart)" index.html || true)" -eq 0
          test "$(grep -c "detail_key:'__planitrip__actTimeEnd'.*data:_blobOnly(S.actTimeEnd)" index.html || true)" -eq 0
          python - <<'PY'
          import re,pathlib,subprocess
          h=pathlib.Path('index.html').read_text(encoding='utf-8'); n=0
          for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script>',h,flags=re.I|re.S):
              if re.search(r'\bsrc\s*=',attrs,flags=re.I): continue
              q=pathlib.Path(f'/tmp/w{n}.js'); q.write_text(body,encoding='utf-8'); subprocess.run(['node','--check',str(q)],check=True); n+=1
          if not n: raise SystemExit('no inline scripts')
          PY
      - name: Commit
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(P0.8-B): stop W6 from overwriting planning blobs"
          git push origin HEAD:gpt/p08b-w6-planning
