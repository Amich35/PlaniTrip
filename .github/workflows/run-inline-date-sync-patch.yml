name: Run inline date sync patch
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-inline-date-sync-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_inline_date_sync.py
      - name: Validate
        run: |
          git diff --check
          grep -q "async function saveInlineActivityDate" index.html
          grep -q "async function saveDateChange" index.html
          test "$(grep -o 'saveInlineActivityDate(this' index.html | wc -l)" -eq 2
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-inline-date-sync-patch.yml scripts/patch_inline_date_sync.py
          git add index.html
          git diff --cached --check
          git commit -m "fix(P0.8/6): await inline activity date sync"
          git push
