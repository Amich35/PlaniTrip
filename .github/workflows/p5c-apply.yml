name: Apply P0.8-A 5C
on:
  push:
    branches:
      - gpt/p08a-p5c-geo
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p08a-p5c-geo
      - name: Patch geocode writer
        run: python .github/scripts/p5c.py
      - name: Validate patch
        run: |
          git diff --check
          test "$(grep -c "sync detail geo" index.html)" -eq 1
          test "$(grep -c "_dfField === '_geo'" index.html)" -eq 1
          python - <<'PY'
          import re, pathlib, subprocess
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          n = 0
          for attrs, body in re.findall(r'<script\b([^>]*)>(.*?)</script>', html, flags=re.I|re.S):
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              q = pathlib.Path(f'/tmp/p5c-inline-{n}.js')
              q.write_text(body, encoding='utf-8')
              subprocess.run(['node','--check',str(q)], check=True)
              n += 1
          if not n:
              raise SystemExit('no inline scripts')
          print('validated', n, 'inline scripts')
          PY
      - name: Commit patch
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(P0.8-A/5C): persist geocode atomically"
          git push origin HEAD:gpt/p08a-p5c-geo
