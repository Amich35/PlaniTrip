name: Apply P0.8-A 5C
on:
  push:
    branches:
      - gpt/p08a-p5c-geo
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p08a-p5c-geo
      - name: Patch geocode writer
        run: python .github/scripts/p5c.py
      - name: Validate patch
        run: |
          git diff --check
          test "$(grep -c "sync detail geo" index.html)" -eq 1
          test "$(grep -c "_dfField === '_geo'" index.html)" -eq 1
          node --check <(python -c "import re,pathlib; h=pathlib.Path('index.html').read_text(); print('\\n'.join(b for a,b in re.findall(r'<script\\b([^>]*)>(.*?)</script>',h,flags=re.I|re.S) if not re.search(r'\\bsrc\\s*=',a,flags=re.I)))")
      - name: Commit patch
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(P0.8-A/5C): persist geocode atomically"
          git push origin HEAD:gpt/p08a-p5c-geo
