name: Temporary payer preserve PR patch

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve stored expense payer
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = """function getExpensePersonOptions(){
  var people = getPeopleList();
  if(!S.expPerson || people.indexOf(S.expPerson)===-1) S.expPerson = people[0];
  return people.map(function(p){
    return '<option value=\"'+escHtml(p)+'\"'+(S.expPerson===p?' selected':'')+'>'+escHtml(personDisplayName(p,'Moi'))+'</option>';
  }).join('');
}"""
          new = """function getExpensePersonOptions(){
  var people = getPeopleList().slice();
  // Une dépense existante conserve toujours son payeur enregistré.
  if(S.expPerson && people.indexOf(S.expPerson)===-1) people.unshift(S.expPerson);
  if(!S.expPerson){
    var currentEmail = CURRENT_USER && CURRENT_USER.email ? CURRENT_USER.email : '';
    S.expPerson = currentEmail && people.indexOf(currentEmail)>-1 ? currentEmail : (people[0]||'');
  }
  return people.map(function(p){
    return '<option value=\"'+escHtml(p)+'\"'+(S.expPerson===p?' selected':'')+'>'+escHtml(personDisplayName(p,'Moi'))+'</option>';
  }).join('');
}"""
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'getExpensePersonOptions target count={count}, expected 1')
          text = text.replace(old, new, 1)
          old_build = "var APP_BUILD = '2026-08-22·sha:balance-parseAmt-fix-v2';"
          new_build = "var APP_BUILD = '2026-08-22·sha:preserve-expense-payer-fix-v3';"
          if text.count(old_build) != 1:
            raise SystemExit(f'APP_BUILD target count={text.count(old_build)}, expected 1')
          text = text.replace(old_build, new_build, 1)
          path.write_text(text, encoding='utf-8')
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/planitrip-main.js').write_text(max(scripts, key=len), encoding='utf-8')
          PY
          node --check /tmp/planitrip-main.js
      - name: Commit patch and self-clean workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-payer-preserve-pr.yml
          git config user.name "PlaniTrip maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/temporary-payer-preserve-pr.yml
          git diff --cached --check
          git commit -m "Budget: préserver le payeur réel lors de l’édition"
          git push origin HEAD:main
