name: ChatGPT Programme 4b fix
on:
  push:
    branches:
      - chatgpt-program-4b
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-program-4b
      - name: Fix and check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(!t || !/^\\\\d{1,2}:\\\\d{2}$/.test(String(t))) return null;"
          new="if(!t || !/^\\d{1,2}:\\d{2}$/.test(String(t))) return null;"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text()
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
            if not code.strip(): continue
            f=Path('/tmp/check_%d.js'%i); f.write_text(code)
            subprocess.run(['node','--check',str(f)],check=True)
          PY
          git diff --check
      - name: Commit
        run: |
          rm .github/workflows/chatgpt-program-4b-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: parse Programme times correctly"
          git push origin HEAD:chatgpt-program-4b
