name: Apply P0.8 Patch 5 custom detail sync
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08-p5-custom-detail-sync.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch custom detail onblur sync
        run: python -c "import base64;exec(base64.b64decode('').decode())"
      - name: Validate patch
        run: |
          git diff --check
          grep -q "function _queueCustomDetailSync" index.html
          grep -q "Modification locale conservée" index.html
          grep -q "select('id',{count:'exact',head:true})" index.html
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p08-p5-custom-detail-sync.yml
          git add index.html
          git diff --cached --check
          git commit -m "fix(P0.8/5): serialize custom detail sync"
          git push
