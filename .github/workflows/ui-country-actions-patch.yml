name: Apply country action UI patch
on:
  push:
    branches: [gpt/ui-country-actions]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: python .github/scripts/ui_country_actions.py
      - name: Validate
        run: |
          git diff --check
          grep -q "country-archive-bg" index.html
          grep -q "svgIcon('archive',16).*Archiver" index.html
          grep -q "Archiver ' + c.name" index.html
          grep -q "_swipeLeftMax" index.html
          python - <<'PY'
          import re,pathlib,subprocess
          h=pathlib.Path('index.html').read_text(encoding='utf-8'); n=0
          for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script>',h,flags=re.I|re.S):
              if re.search(r'\bsrc\s*=',attrs,flags=re.I): continue
              q=pathlib.Path(f'/tmp/u{n}.js'); q.write_text(body,encoding='utf-8'); subprocess.run(['node','--check',str(q)],check=True); n+=1
          if not n: raise SystemExit('no inline scripts')
          PY
      - name: Commit patch
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): clarify country archive swipe action"
          git push origin HEAD:gpt/ui-country-actions
