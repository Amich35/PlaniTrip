name: Apply movement incomplete color
on:
  push:
    paths:
      - .github/workflows/codex-movement-incomplete-color.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/planitrip.patch
          git apply --check /tmp/planitrip.patch
          git apply /tmp/planitrip.patch
          rm .github/workflows/codex-movement-incomplete-color.yml
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add index.html .github/workflows/codex-movement-incomplete-color.yml
          git commit -m "Harmonise la couleur des éléments à compléter"
          git push origin main
