name: Patch done sync await
on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-done-sync-await.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_done_sync_await.py
      - name: Validate
        run: |
          git diff --check
          grep -q "async function toggleAct(k)" index.html
          grep -q "await _syncActivityState(k, CURRENT_TRIP.id)" index.html
          grep -q "Impossible de modifier le statut Fait" index.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-done-sync-await.yml scripts/patch_done_sync_await.py
          git add index.html
          git diff --cached --check
          git commit -m "fix(P1-A): await done status sync"
          git push
