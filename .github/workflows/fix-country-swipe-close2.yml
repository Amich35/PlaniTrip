name: Apply continuous swipe close v2
on:
  push:
    branches: [gpt/fix-country-swipe-close]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch swipe
        run: python .github/scripts/fix_country_swipe_close.py
      - name: Validate
        run: |
          git diff --check
          grep -q "Une carte deja ouverte suit le doigt" index.html
          grep -q "Un simple tap sur une carte ouverte" index.html
          python - <<'PY'
          import re,pathlib,subprocess
          h=pathlib.Path('index.html').read_text(encoding='utf-8'); n=0
          for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script>',h,flags=re.I|re.S):
              if re.search(r'\bsrc\s*=',attrs,flags=re.I): continue
              q=pathlib.Path(f'/tmp/sw{n}.js'); q.write_text(body,encoding='utf-8'); subprocess.run(['node','--check',str(q)],check=True); n+=1
          if not n: raise SystemExit('no inline scripts')
          PY
      - name: Commit patch
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): make swipe close continuous"
          git push origin HEAD:gpt/fix-country-swipe-close
