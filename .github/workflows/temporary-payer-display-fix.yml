name: Temporary payer display fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'trigger-payer-display-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch payer preservation and display only
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_options = """function getExpensePersonOptions(){
            var people = getPeopleList();
            if(!S.expPerson || people.indexOf(S.expPerson)===-1) S.expPerson = people[0];
            return people.map(function(p){
              return '<option value=\"'+escHtml(p)+'\"'+(S.expPerson===p?' selected':'')+'>'+escHtml(personDisplayName(p,'Moi'))+'</option>';
            }).join('');
          }"""
          new_options = """function getExpensePersonOptions(){
            var people = getPeopleList().slice();
            // En édition, conserver le payeur enregistré même s'il n'est plus dans la liste courante.
            // Cela évite de le remplacer silencieusement par le premier voyageur.
            if(S.expPerson){
              if(people.indexOf(S.expPerson)===-1) people.unshift(S.expPerson);
            }else{
              S.expPerson = people[0] || '';
            }
            return people.map(function(p){
              return '<option value=\"'+escHtml(p)+'\"'+(S.expPerson===p?' selected':'')+'>'+escHtml(personDisplayName(p,'Moi'))+'</option>';
            }).join('');
          }"""
          count = text.count(old_options)
          if count != 1:
            raise SystemExit(f'getExpensePersonOptions target count={count}, expected 1')
          text = text.replace(old_options, new_options, 1)

          old_recent = """    return '<div onclick=\"openEditExpenseModal('+e.id+')\" style=\"display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:.5px solid var(--divider);cursor:pointer\"><span style=\"font-size:18px\">'+(c?c.flag:'')+'</span><span style=\"flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escHtml(e.desc||getExpenseCategoryLabel(e.category))+'</span><span style=\"font-size:13px;font-weight:700;color:var(--ink)\">'+fmtEUR(budgetExpenseDisplayAmount(e,scope))+'</span><span style=\"color:var(--ink-subtle)\">'+svgIcon('chevron-right',15)+'</span></div>';"""
          new_recent = """    var whoLabel = canonicalPerson(e.personLabel || e.person || '?');
            return '<div onclick=\"openEditExpenseModal('+e.id+')\" style=\"display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:.5px solid var(--divider);cursor:pointer\"><span style=\"font-size:18px\">'+(c?c.flag:'')+'</span><span style=\"flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escHtml(e.desc||getExpenseCategoryLabel(e.category))+'<div style=\"font-size:11px;color:var(--ink-subtle);font-weight:400\">Payé par '+escHtml(personDisplayName(whoLabel,'moi'))+'</div></span><span style=\"font-size:13px;font-weight:700;color:var(--ink)\">'+fmtEUR(budgetExpenseDisplayAmount(e,scope))+'</span><span style=\"color:var(--ink-subtle)\">'+svgIcon('chevron-right',15)+'</span></div>';"""
          count = text.count(old_recent)
          if count != 1:
            raise SystemExit(f'recent payer row target count={count}, expected 1')
          text = text.replace(old_recent, new_recent, 1)

          old_all = """        return '<div class=\"expense-entry\" onclick=\"openEditExpenseModal('+e.id+')\" style=\"cursor:pointer;padding:12px 0\"><span style=\"font-size:18px;margin-right:4px\">'+(co?co.flag:'')+'</span><span class=\"ee-cat\">'+svgIcon(getExpenseCategoryIcon(e.category),14)+'</span><span class=\"ee-desc\">'+escHtml(e.desc||getExpenseCategoryLabel(e.category))+'<div style=\"font-size:11px;color:var(--ink-subtle);font-weight:400\">'+formatDateFR(e.date)+''+'</div></span><span class=\"ee-amount\">'+fmtEUR(budgetExpenseDisplayAmount(e,allScope))+'</span><span style=\"color:var(--ink-subtle)\">'+svgIcon('chevron-right',15)+'</span></div>';"""
          new_all = """        var whoLabel = canonicalPerson(e.personLabel || e.person || '?');
            return '<div class=\"expense-entry\" onclick=\"openEditExpenseModal('+e.id+')\" style=\"cursor:pointer;padding:12px 0\"><span style=\"font-size:18px;margin-right:4px\">'+(co?co.flag:'')+'</span><span class=\"ee-cat\">'+svgIcon(getExpenseCategoryIcon(e.category),14)+'</span><span class=\"ee-desc\">'+escHtml(e.desc||getExpenseCategoryLabel(e.category))+'<div style=\"font-size:11px;color:var(--ink-subtle);font-weight:400\">'+formatDateFR(e.date)+' · Payé par '+escHtml(personDisplayName(whoLabel,'moi'))+'</div></span><span class=\"ee-amount\">'+fmtEUR(budgetExpenseDisplayAmount(e,allScope))+'</span><span style=\"color:var(--ink-subtle)\">'+svgIcon('chevron-right',15)+'</span></div>';"""
          count = text.count(old_all)
          if count != 1:
            raise SystemExit(f'all expenses payer row target count={count}, expected 1')
          text = text.replace(old_all, new_all, 1)

          old_build = "var APP_BUILD = '2026-08-22·sha:balance-parseAmt-fix-v2';"
          new_build = "var APP_BUILD = '2026-08-22·sha:payer-preserve-display-fix-v3';"
          count = text.count(old_build)
          if count != 1:
            raise SystemExit(f'APP_BUILD target count={count}, expected 1')
          text = text.replace(old_build, new_build, 1)

          path.write_text(text, encoding='utf-8')
      - name: Validate diff and JavaScript syntax
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          main = max(scripts, key=len)
          Path('/tmp/planitrip-main.js').write_text(main, encoding='utf-8')
          PY
          node --check /tmp/planitrip-main.js
          git diff -- index.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 1
          fi
          git config user.name "PlaniTrip maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Budget: préserver et afficher le payeur réel"
          git push origin HEAD:main
