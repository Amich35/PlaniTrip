name: Apply compact movement duration
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-compact-movement-duration.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update duration format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          content = path.read_text()
          old = "return wholeHours+' h'+(remainingMinutes?' '+remainingMinutes:'');"
          new = "return wholeHours+'h'+(remainingMinutes?String(remainingMinutes).padStart(2,'0'):'');"
          if content.count(old) != 1:
              raise SystemExit("Duration formatter not found exactly once")
          path.write_text(content.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compacte le format des durées"
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-compact-movement-duration.yml
          git commit -m "Retire le workflow temporaire"
      - name: Push
        run: git push origin main
