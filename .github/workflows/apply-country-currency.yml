name: Apply country currency persistence
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-country-currency.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/country-currency.patch
          git apply /tmp/country-currency.patch
          rm .github/workflows/apply-country-currency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-country-currency.yml
          git commit -m "Persiste les devises des infos pratiques"
          git push origin main
