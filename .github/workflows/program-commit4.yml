name: Programme commit 4 patch

on:
  push:
    branches:
      - program-commit4-outings
    paths:
      - '.github/workflows/program-commit4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program-commit4-outings
          fetch-depth: 0
      - name: Apply targeted patch
        run: python .tmp/program_commit4_patch.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          checked=0
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              f=Path('/tmp')/f'planitrip_inline_{i}.js'
              f.write_text(b, encoding='utf-8')
              subprocess.run(['node','--check',str(f)], check=True)
              checked+=1
          print(f'Checked {checked} inline script blocks')
          PY
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit clean implementation only
        run: |
          rm -f .tmp/program_commit4_patch.py .github/workflows/program-commit4.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'PlaniTrip Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Etape 5 (Programme) - commit 4: excursions en lecture seule'
          git push origin HEAD:program-commit4-outings
