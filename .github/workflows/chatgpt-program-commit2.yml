name: ChatGPT Programme commit 2

on:
  push:
    branches: [chatgpt-program-commit2]
    paths:
      - '.github/workflows/chatgpt-program-commit2.yml'
      - '.chatgpt/apply_program_commit2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 .chatgpt/apply_program_commit2.py
      - name: Syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          checked=0
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              f=Path('/tmp')/f'planitrip-inline-{i}.js'
              f.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
              checked+=1
          print('checked',checked,'inline script blocks')
          PY
      - name: Verify scope and cleanup helpers
        run: |
          git diff --check
          git diff -- index.html
          rm -f .chatgpt/apply_program_commit2.py .github/workflows/chatgpt-program-commit2.yml
          rmdir .chatgpt 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit clean result
        run: |
          git config user.name 'ChatGPT PlaniTrip'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Etape 5 (Programme) - commit 2: coquille écran + sélecteur de jour'
          git push origin HEAD:chatgpt-program-commit2
