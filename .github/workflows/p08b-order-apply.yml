name: Apply P0.8-B act order
on:
  push:
    branches:
      - gpt/p08b-act-order
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p08b-act-order
      - name: Patch act order
        run: python .github/scripts/p08b_order.py
      - name: Validate
        run: |
          git diff --check
          test "$(grep -c "detail_key:'__planitrip__actOrder__'+ck" index.html)" -eq 1
          test "$(grep -c "syncActOrder(ck);" index.html)" -eq 2
          python - <<'PY'
          import re,pathlib,subprocess
          h=pathlib.Path('index.html').read_text(encoding='utf-8'); n=0
          for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script>',h,flags=re.I|re.S):
              if re.search(r'\bsrc\s*=',attrs,flags=re.I): continue
              q=pathlib.Path(f'/tmp/o{n}.js'); q.write_text(body,encoding='utf-8'); subprocess.run(['node','--check',str(q)],check=True); n+=1
          if not n: raise SystemExit('no inline scripts')
          PY
      - name: Commit
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(P0.8-B): persist activity order per city"
          git push origin HEAD:gpt/p08b-act-order
