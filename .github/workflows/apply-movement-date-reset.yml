name: Apply movement date reset fix
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-movement-date-reset.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '' | base64 -d > /tmp/movement-date-reset.patch
          git am /tmp/movement-date-reset.patch
          git rm .github/workflows/apply-movement-date-reset.yml
          git commit --amend --no-edit
          git push origin main
