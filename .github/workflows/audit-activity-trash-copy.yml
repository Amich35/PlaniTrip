name: Audit activity trash wording
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-activity-trash-copy.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show activity trash wording contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['Archiver','Supprimer','Corbeille','deletedActs','syncDeletedActs','Supprimer définitivement']
          for needle in needles:
              print('\n===== '+needle+' =====')
              start=0; n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  print(f'--- occurrence {n} at {i} ---')
                  print(s[max(0,i-500):min(len(s),i+700)].replace('\n','\\n'))
                  start=i+len(needle)
              print('COUNT',n)
          PY
      - name: Cleanup audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-activity-trash-copy.yml
          git commit -m "chore: remove activity trash wording audit"
          git push
