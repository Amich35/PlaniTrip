name: Simplify flight form
on:
  push:
    paths:
      - .github/workflows/simplify-flight-form.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/simplify-flight-form.patch
          git apply --check /tmp/simplify-flight-form.patch
          git apply /tmp/simplify-flight-form.patch
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simplify-flight-form.yml
          git add index.html
          git commit -m "fix: remove flight link and note fields"
          git push origin main
