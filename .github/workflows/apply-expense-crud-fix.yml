name: Apply server-first expense CRUD patch
on:
  push:
    paths:
      - '.github/workflows/apply-expense-crud-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/expense.patch
          git apply --check /tmp/expense.patch
          git apply /tmp/expense.patch
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-expense-crud-fix.yml
          git add index.html
          git commit -m "fix: make expense CRUD server-first"
          git push origin main
