name: Apply budget select-all patch
on:
  push:
    paths:
      - .github/workflows/apply-budget-select-all.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        env:
          PATCH_B64: From https://github.com/Amich35/PlaniTrip
 * branch            main       -> FETCH_HEAD

        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/budget-select-all.patch
          git apply --check /tmp/budget-select-all.patch
          git apply /tmp/budget-select-all.patch
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-budget-select-all.yml
          git add index.html
          git commit -m "feat: add select-all budget participants"
          git push origin main
