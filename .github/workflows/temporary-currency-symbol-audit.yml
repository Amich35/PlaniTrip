name: Temporary currency symbol fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply display-only currency symbol patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_helper = "function getCurrencySymbol(c){ var m=(c&&c.currency||'').match(/\\(([^)]+)\\)/); return m?m[1]:((c&&c.currency)||''); }"
          new_helper = """var CURRENCY_SYMBOLS={
            EUR:'€',USD:'$',JPY:'¥',GBP:'£',CNY:'¥',KRW:'₩',INR:'₹',
            KHR:'៛',THB:'฿',LAK:'₭',VND:'₫',IDR:'Rp',PHP:'₱',MYR:'RM',SGD:'S$',
            TWD:'NT$',HKD:'HK$',AUD:'A$',NZD:'NZ$',CAD:'C$',RUB:'₽',TRY:'₺',UAH:'₴',
            ILS:'₪',NGN:'₦',GHS:'₵',PLN:'zł',CZK:'Kč',HUF:'Ft',BRL:'R$',MXN:'Mex$',ZAR:'R',CHF:'CHF'
          };
          function currencySymbolFromCode(code){
            code=String(code||'').trim().toUpperCase();
            if(!code)return '';
            if(CURRENCY_SYMBOLS[code])return CURRENCY_SYMBOLS[code];
            try{
              var parts=new Intl.NumberFormat('fr-FR',{style:'currency',currency:code,currencyDisplay:'narrowSymbol',minimumFractionDigits:0,maximumFractionDigits:0}).formatToParts(0);
              for(var i=0;i<parts.length;i++)if(parts[i].type==='currency'&&parts[i].value)return parts[i].value;
            }catch(e){}
            return code;
          }
          function getCurrencySymbol(c){
            var raw=String((c&&c.currency)||'').trim();
            if(!raw)return '';
            var explicit=raw.match(/\\(([€$¥£₩₹฿₫₭₱៛₽₺₴₪₦₵]+)\\)/);
            if(explicit)return explicit[1];
            var code='';
            var parenCodes=raw.match(/\\(([A-Z]{3})\\)/g);
            if(parenCodes&&parenCodes.length)code=parenCodes[parenCodes.length-1].replace(/[()]/g,'');
            if(!code&&c&&c.rate){var rateCode=String(c.rate).match(/\\b([A-Z]{3})\\b/);if(rateCode)code=rateCode[1];}
            if(!code){
              var nameCodes={riel:'KHR',kip:'LAK',baht:'THB',dong:'VND',rupiah:'IDR',peso:'PHP',yen:'JPY',euro:'EUR'};
              var low=raw.toLowerCase();
              Object.keys(nameCodes).some(function(name){if(low.indexOf(name)>-1){code=nameCodes[name];return true;}return false;});
            }
            if(!code){var rawCode=raw.match(/\\b([A-Z]{3})\\b/);if(rawCode)code=rawCode[1];}
            var symbol=currencySymbolFromCode(code);
            if(/\\bUSD\\b/.test(raw)&&code!=='USD'){
              var usd=currencySymbolFromCode('USD');
              if(symbol&&symbol!==usd)symbol+=' / '+usd;
            }
            return symbol||raw;
          }"""

          old_labels = """  var currencyCode = (c.currency.match(/\\(([^)]+)\\)/)||[,c.currency])[1];
            var fromLabel = dir==='eur' ? 'EUR' : currencyCode;
            var toLabel = dir==='eur' ? currencyCode : 'EUR';"""
          new_labels = """  var localSymbol = getCurrencySymbol(c);
            var fromLabel = dir==='eur' ? '€' : localSymbol;
            var toLabel = dir==='eur' ? localSymbol : '€';"""

          replacements = [
            (old_helper, new_helper, 1, 'currency symbol helper'),
            (old_labels, new_labels, 2, 'converter labels'),
            ("+'<span style=\"font-size:14px;color:var(--ink-muted)\">'+escHtml(c.currency||'')+'</span>'", "+'<span style=\"font-size:14px;color:var(--ink-muted)\">'+escHtml(getCurrencySymbol(c))+'</span>'", 1, 'rate editor symbol'),
            ("var APP_BUILD = '2026-08-22·sha:payer-preserve-display-fix-v3';", "var APP_BUILD = '2026-08-22·sha:currency-symbols-v4';", 1, 'build marker'),
          ]

          for old,new,expected,label in replacements:
            count=text.count(old)
            if count!=expected:
              raise SystemExit(f'{label}: target count={count}, expected {expected}')
            text=text.replace(old,new)

          path.write_text(text,encoding='utf-8')
      - name: Validate diff and JavaScript syntax
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/planitrip-main.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/planitrip-main.js
          grep -q "currency-symbols-v4" index.html
          grep -q "KHR:'៛'" index.html
          grep -q "THB:'฿'" index.html
          grep -q "VND:'₫'" index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "PlaniTrip maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "UI: afficher les symboles de devises"
          git push origin HEAD:main
