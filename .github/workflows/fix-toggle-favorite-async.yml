name: Fix favorite async keyword
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-toggle-favorite-async.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: python scripts/fix_toggle_favorite_async.py
      - name: Validate
        run: |
          git diff --check
          grep -q "async function toggleFavorite(k)" index.html
          grep -q "async function toggleAct(k)" index.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-toggle-favorite-async.yml scripts/fix_toggle_favorite_async.py
          git add index.html
          git diff --cached --check
          git commit -m "fix: preserve async favorite toggle"
          git push
