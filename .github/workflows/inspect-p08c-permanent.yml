name: Inspect P0.8-C permanent deletion
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-p08c-permanent.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve permanent-delete CTA label
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"function deleteCityPermanently\(trashId\)\{.*?\n\}"
          m=re.search(pattern,s,flags=re.S)
          if not m:
            raise SystemExit('deleteCityPermanently not found')
          block=m.group(0)
          old="  });\n}"
          new="  }, 'Supprimer définitivement');\n}"
          if old not in block:
            raise SystemExit('CTA closing pattern not found')
          block=block.rsplit(old,1)[0]+new
          p.write_text(s[:m.start()]+block+s[m.end():],encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: preserve permanent city delete CTA"
          git push
