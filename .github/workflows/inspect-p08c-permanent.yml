name: Inspect P0.8-C permanent deletion
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-p08c-permanent.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply permanent deletion patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"function deleteCityPermanently\(trashId\)\{.*?\n\}"
          if len(re.findall(pattern,s,flags=re.S)) != 1:
            raise SystemExit('deleteCityPermanently match count is not 1')
          replacement="""function deleteCityPermanently(trashId){
  var t = S.cityTrash.find(function(tt){return tt.id===trashId;});
  if(!t) return;
  showConfirm('Supprimer définitivement '+t.cityName+' ? Cette action est irréversible.<br><small>La ville et ses activités seront supprimées. Les logements, dépenses et le carnet seront conservés.</small>', async function(){
    var idx = S.cityTrash.findIndex(function(tt){return tt.id===trashId;});
    if(idx===-1) return;
    var countryId = t.countryId;
    var tripId = CURRENT_TRIP && CURRENT_TRIP.id;

    // P0.8-C : suppression physique limitée aux activités de la ville.
    // Logements, dépenses et carnet restent intacts.
    if(!sb || !tripId){
      alert('Connexion requise pour supprimer définitivement cette ville.');
      return;
    }
    try{
      var rAct = await sb.from('activities').delete()
        .eq('trip_id',tripId)
        .eq('country_id',countryId)
        .eq('city',t.cityName);
      if(rAct && rAct.error) throw rAct.error;

      // Le marqueur deletedCities est conservé : la ville reste définitivement masquée.
      S.cityTrash.splice(idx,1);
      await removeCityTrashEntry(t);
      syncCityTrash();
      save();
      openCountryDetail(countryId, 'lieux');
      toast('Ville supprimée définitivement');
    }catch(err){
      console.error('[PlaniTrip] permanent city delete:', err);
      alert('Impossible de supprimer définitivement cette ville pour le moment.');
    }
  });
}"""
          p.write_text(re.sub(pattern,replacement,s,count=1,flags=re.S),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: limit permanent city deletion to activities"
          git push
