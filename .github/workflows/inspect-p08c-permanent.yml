name: Inspect P0.8-C permanent deletion
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-p08c-permanent.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply permanent deletion patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"function deleteCityPermanently\(trashId\)\{.*?\n\}"
          if len(re.findall(pattern,s,flags=re.S)) != 1:
            raise SystemExit('deleteCityPermanently match count is not 1')
          replacement=base64.b64decode('').decode('utf-8')
          p.write_text(re.sub(pattern,replacement,s,count=1,flags=re.S),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: limit permanent city deletion to activities"
          git push
