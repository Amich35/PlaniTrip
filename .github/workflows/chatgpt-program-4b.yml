name: ChatGPT Programme 4b
on:
  push:
    branches:
      - chatgpt-program-4b
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-program-4b
          fetch-depth: 0
      - name: Patch
        run: |
          echo ' xKQo=' >/tmp/placeholder
          rm /tmp/placeholder
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data='PLACEHOLDER'
          Path('/tmp/patch.py').write_bytes(base64.b64decode(data))
          PY
          python3 /tmp/patch.py
      - name: Check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
            if not code.strip():
              continue
            f=Path('/tmp/check_%d.js'%i)
            f.write_text(code)
            subprocess.run(['node','--check',str(f)],check=True)
          PY
          git diff --check
      - name: Commit
        run: |
          rm .github/workflows/chatgpt-program-4b.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Etape 5 (Programme) - commit 4b: chronologie activites et excursions"
          git push origin HEAD:chatgpt-program-4b
