name: ChatGPT Programme 4b
on:
  push:
    branches:
      - chatgpt-program-4b
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-program-4b
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data=' xKQo='
          data=data.replace(' ','')
          Path('/tmp/patch.py').write_bytes(base64.b64decode(data))
          PY
          cat >/tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="var APP_BUILD = '2026-09-02·sha:program-outings-readonly-v1';"
          new="var APP_BUILD = '2026-09-03·sha:program-chronology-v1';"
          assert old in s
          s=s.replace(old,new,1)
          old="    return baseCard+_programActivitiesBlock('Activités à '+tonight.label,day.baseActivities||[]);"
          assert old in s
          s=s.replace(old,"    return baseCard;",1)
          marker='function renderProgramScreen(){'
          assert marker in s
          insert="""function _programTimeValue(t){
            if(!t || !/^\\d{1,2}:\\d{2}$/.test(String(t))) return null;
            var parts=String(t).split(':');
            var h=parseInt(parts[0],10), m=parseInt(parts[1],10);
            if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return null;
            return h*60+m;
          }
          function _programActivityAnchor(item){
            if(!item) return null;
            var t=(S.actTimeStart&&S.actTimeStart[item.actKey]) || (S.actTime&&S.actTime[item.actKey]) || '';
            return _programTimeValue(t);
          }
          function _programOutingAnchor(slot){
            if(!slot || !slot.outing) return null;
            var ids=Array.isArray(slot.outing.movementIds) ? slot.outing.movementIds : [];
            var movementTimes=ids.map(function(id){
              var m=S.movements&&S.movements[id];
              return m ? _programTimeValue(m.departureTime||'') : null;
            }).filter(function(v){ return v!==null; });
            if(movementTimes.length) return Math.min.apply(null,movementTimes);
            var activityTimes=(Array.isArray(slot.activities)?slot.activities:[]).map(_programActivityAnchor).filter(function(v){ return v!==null; });
            return activityTimes.length ? Math.min.apply(null,activityTimes) : null;
          }
          function _programRenderTimeline(day){
            if(!day) return '';
            var entries=[];
            (day.baseActivities||[]).forEach(function(item,i){ entries.push({kind:'activity',anchor:_programActivityAnchor(item),order:i,item:item}); });
            (day.outings||[]).forEach(function(slot,i){ entries.push({kind:'outing',anchor:_programOutingAnchor(slot),order:1000+i,slot:slot}); });
            var timed=entries.filter(function(e){ return e.anchor!==null; });
            var untimed=entries.filter(function(e){ return e.anchor===null; });
            timed.sort(function(a,b){ return a.anchor-b.anchor || a.order-b.order; });
            var html=timed.map(function(e){
              if(e.kind==='outing') return _programRenderOutingCard(e.slot);
              return '<div class=\"info-card\" style=\"padding:12px 14px;margin-top:10px\">'+_programActivityRow(e.item)+'</div>';
            }).join('');
            if(untimed.length){
              html+='<div style=\"margin-top:18px\"><div style=\"font-size:11px;font-weight:700;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px\">Horaire à préciser</div>'
                +untimed.map(function(e){
                  if(e.kind==='outing') return _programRenderOutingCard(e.slot);
                  return '<div class=\"info-card\" style=\"padding:12px 14px;margin-top:8px\">'+_programActivityRow(e.item)+'</div>';
                }).join('')
              +'</div>';
            }
            return html ? '<div style=\"margin-top:10px\">'+html+'</div>' : '';
          }

          """
          s=s.replace(marker,insert+marker,1)
          old="""      +_programRenderBase(programDay)
                +_programRenderOutings(programDay)
                +'<div style=\"font-size:11.5px;color:var(--ink-subtle);text-align:center;margin-top:18px\">Autres activités et déplacements — commits suivants</div>'"""
          new="""      +_programRenderBase(programDay)
                +((programDay.base&&programDay.base.confidence==='transition')?_programRenderOutings(programDay):_programRenderTimeline(programDay))
                +'<div style=\"font-size:11.5px;color:var(--ink-subtle);text-align:center;margin-top:18px\">Autres activités et déplacements — commits suivants</div>'"""
          if old not in s:
            old=old.replace('                +','      +')
            new=new.replace('                +','      +')
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 /tmp/patch.py
      - name: Check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
            if not code.strip(): continue
            f=Path('/tmp/check_%d.js'%i)
            f.write_text(code)
            subprocess.run(['node','--check',str(f)],check=True)
          PY
          git diff --check
      - name: Commit
        run: |
          rm .github/workflows/chatgpt-program-4b.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Etape 5 (Programme) - commit 4b: chronologie activites et excursions"
          git push origin HEAD:chatgpt-program-4b
