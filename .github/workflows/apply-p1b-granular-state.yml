name: Apply P1-B granular activity state patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-p1b-granular-state.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/p1b.patch
          git apply --check /tmp/p1b.patch
          git apply /tmp/p1b.patch
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-p1b-granular-state.yml
          git add index.html
          git commit -m "fix: isolate activity state writes by field"
          git push origin main
