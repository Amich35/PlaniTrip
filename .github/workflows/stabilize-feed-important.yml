name: Stabilize feed important status
on:
  push:
    paths:
      - .github/workflows/stabilize-feed-important.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply feed important status patch
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/planitrip.patch
          git apply --check /tmp/planitrip.patch
          git apply /tmp/planitrip.patch
          git rm .github/workflows/stabilize-feed-important.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: make feed important status server-first"
          git push origin main
