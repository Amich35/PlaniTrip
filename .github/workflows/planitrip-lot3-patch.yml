name: PlaniTrip lot 3 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/planitrip-lot3-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify expected parent
        run: |
          test "$(git rev-parse HEAD^)" = "854155a12a6d2ba0ba3b13dac1bad687287a97dd"
      - name: Apply minimal lot 3 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_build = "var APP_BUILD = '2026-08-24·sha:create-trip-resume-v1';"
          new_build = "var APP_BUILD = '2026-08-24·sha:clean-program-dates-v1';"
          assert s.count(old_build) == 1, 'APP_BUILD inattendu'
          s = s.replace(old_build, new_build, 1)

          old_rebuild = """  BUILT_IN_COUNTRIES.forEach(function(c){ COUNTRIES.push(JSON.parse(JSON.stringify(c))); });"""
          new_rebuild = """  BUILT_IN_COUNTRIES.forEach(function(c){
    var builtInCopy = JSON.parse(JSON.stringify(c));
    // Le programme intégré est un héritage du voyage historique Asie 2026.
    // Pour tout autre voyage, le programme vient uniquement de son état namespacé
    // et de Supabase (cities/activities filtrés par trip_id).
    if(CURRENT_TRIP && CURRENT_TRIP.name !== 'Asie 2026') builtInCopy.cities = [];
    COUNTRIES.push(builtInCopy);
  });"""
          assert s.count(old_rebuild) == 1, 'rebuildCountriesFromState inattendu'
          s = s.replace(old_rebuild, new_rebuild, 1)

          old_migration = """  // Migration one-shot : le tout premier trip ouvert dans ce navigateur (tous comptes confondus)
  // réclame les anciennes données Asie. Aucun autre trip n'y touche ensuite.
  if (!localStorage.getItem(namespacedKey) && !localStorage.getItem('planitrip_legacy_claimed')) {
    const legacy = localStorage.getItem('asie2026');
    if (legacy) {
      localStorage.setItem(namespacedKey, legacy);
      localStorage.setItem('planitrip_legacy_claimed', trip.id);
    }
  }"""
          new_migration = """  // Migration legacy strictement réservée au voyage historique Asie 2026.
  // Un voyage neuf ne doit jamais réclamer le blob local `asie2026` simplement parce
  // qu'il est le premier voyage ouvert sur ce navigateur.
  if (trip.name === 'Asie 2026' && !localStorage.getItem(namespacedKey) && !localStorage.getItem('planitrip_legacy_claimed')) {
    const legacy = localStorage.getItem('asie2026');
    if (legacy) {
      localStorage.setItem(namespacedKey, legacy);
      localStorage.setItem('planitrip_legacy_claimed', trip.id);
    }
  }"""
          assert s.count(old_migration) == 1, 'migration legacy inattendue'
          s = s.replace(old_migration, new_migration, 1)

          old_enter_dates = """  if(!skipAutofillDates) autofillMissingCountryDates();"""
          new_enter_dates = """  // Les dates par pays sont explicites : ouvrir un voyage ne doit jamais les inventer."""
          assert s.count(old_enter_dates) == 1, 'appel autofill enterTrip inattendu'
          s = s.replace(old_enter_dates, new_enter_dates, 1)

          old_add_country = """  autofillMissingCountryDates();
  save();
  renderContent();
}

async function openCountryModal()"""
          new_add_country = """  // Un pays ajouté reste sans dates tant que l'utilisateur ne les a pas définies.
  save();
  renderContent();
}

async function openCountryModal()"""
          assert s.count(old_add_country) == 1, 'appel autofill ajout pays inattendu'
          s = s.replace(old_add_country, new_add_country, 1)

          pattern = re.compile(r"  // Distribuer les dates du voyage équitablement entre les pays\.[\s\S]*?  autofillMissingCountryDates\(\);\n\n  showPostCreateModal\(trip\);", re.M)
          matches = list(pattern.finditer(s))
          assert len(matches) == 1, f'bloc dates création inattendu: {len(matches)}'
          replacement = """  // Les dates globales du voyage restent sur trips.start_date/end_date.
  // Les dates de chaque pays restent volontairement indéfinies jusqu'à une saisie explicite.

  showPostCreateModal(trip);"""
          s = pattern.sub(replacement, s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('Aucun script inline trouvé')
          for i, js in enumerate(scripts):
              f = Path(f'/tmp/planitrip-inline-{i}.js')
              f.write_text(js, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], text=True, capture_output=True)
              if r.returncode:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f'Erreur syntaxique dans script inline #{i}')
          print(f'{len(scripts)} scripts inline valides')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "Amich35"
          git config user.email "a-michel9@hotmail.fr"
          rm .github/workflows/planitrip-lot3-patch.yml
          git add index.html .github/workflows/planitrip-lot3-patch.yml
          git commit -m "Isole le programme et fiabilise les dates"
          git push origin main
