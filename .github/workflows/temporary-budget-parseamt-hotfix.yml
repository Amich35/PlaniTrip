name: Temporary budget parseAmt hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-budget-parseamt-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply temporary budget parseAmt hotfix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch balance parsing only
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_canonical = """function canonicalPerson(label){
            if(!label) return label;
            var raw=String(label).trim();
            if(!raw) return raw;
            if(REVERSE_ALIAS_MAP[raw]) return REVERSE_ALIAS_MAP[raw];
            // Compatibilité historique : avant l'identité email stable, certaines dépenses du
            // propriétaire pouvaient conserver son ancien libellé/pseudo. On le résout à la
            // volée vers l'email actuel, sans modifier les dépenses ni les données Supabase.
            var ownerLabel = CURRENT_TRIP && CURRENT_TRIP.owner_label ? String(CURRENT_TRIP.owner_label).trim() : '';
            var ownerEmail = CURRENT_TRIP && CURRENT_TRIP.owner_email ? String(CURRENT_TRIP.owner_email).trim() : '';
            if(ownerLabel && raw===ownerLabel){
              if(ownerEmail) return ownerEmail;
              if(CURRENT_USER && CURRENT_TRIP && CURRENT_TRIP.owner_id===CURRENT_USER.id && CURRENT_USER.email){
                return String(CURRENT_USER.email).trim();
              }
            }
            return raw;
          }"""
          new_canonical = """function canonicalPerson(label){
            if(!label) return label;
            return REVERSE_ALIAS_MAP[label] || label;
          }"""

          replacements = [
            (old_canonical, new_canonical, 'canonicalPerson hotfix'),
            ("  var ownerE = CURRENT_TRIP && (CURRENT_TRIP.owner_email || CURRENT_TRIP.owner_label);\n  ownerE = canonicalPerson(ownerE);\n", "  var ownerE = CURRENT_TRIP && (CURRENT_TRIP.owner_email || CURRENT_TRIP.owner_label);\n", 'owner canonicalization hotfix'),
            ("    var montantPaye = Number(e.amount) || 0;", "    var montantPaye = parseAmt(e.amount) || 0;", 'expense amount parser'),
            ("        sharesMap[ck] = (sharesMap[ck]||0) + (Number(e.splits[k])||0);", "        var splitAmount = parseAmt(e.splits[k]);\n        sharesMap[ck] = (sharesMap[ck]||0) + (isNaN(splitAmount) ? 0 : splitAmount);", 'split parser'),
            ("    var amt = Number(e.amount) || 0;", "    var amt = parseAmt(e.amount) || 0;", 'reimbursement parser'),
            ("var APP_BUILD = '2026-08-22·sha:computeBalances-formatDateFR-fix-v1';", "var APP_BUILD = '2026-08-22·sha:balance-parseAmt-fix-v2';", 'build marker'),
          ]

          for old, new, label in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: target count={count}, expected 1')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Validate diff and JavaScript syntax
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          main = max(scripts, key=len)
          Path('/tmp/planitrip-main.js').write_text(main, encoding='utf-8')
          PY
          node --check /tmp/planitrip-main.js
      - name: Commit patch
        run: |
          git config user.name "PlaniTrip maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Budget: restaurer le parsing financier des soldes"
          git push origin HEAD:main
