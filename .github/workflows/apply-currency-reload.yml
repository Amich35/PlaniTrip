name: Apply currency reload fix
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-currency-reload.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/currency-reload.patch
          git apply /tmp/currency-reload.patch
          rm .github/workflows/apply-currency-reload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-currency-reload.yml
          git commit -m "Fiabilise le rechargement des devises"
          git push origin main
