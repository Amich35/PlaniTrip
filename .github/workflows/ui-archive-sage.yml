name: Apply archive sage color
on:
  push:
    branches: [gpt/ui-archive-sage]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch color
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="background:var(--red-muted);color:#fff;font-size:12px;font-weight:600\" onclick=\"archiveCurrentCountry"
          new="background:#6F8378;color:#fff;font-size:12px;font-weight:600\" onclick=\"archiveCurrentCountry"
          n=s.count(old)
          if n!=1: raise SystemExit(f'expected 1 archive color match, got {n}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          grep -q 'background:#6F8378;color:#fff;font-size:12px;font-weight:600' index.html
          if grep -q 'country-archive-bg.*background:var(--red-muted)' index.html; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "style(ui): use sage color for country archive"
          git push origin HEAD:gpt/ui-archive-sage
