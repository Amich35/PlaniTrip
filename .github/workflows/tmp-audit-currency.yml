name: Temporary currency helper audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture focused currency helper context
        shell: bash
        run: |
          set -eu
          {
            echo '=== BASE helper area ==='
            git show cdfd67347e6e043e54b4647b3431d15c68fded46:index.html | sed -n '10755,10830p'
            echo
            echo '=== CURRENT helper area ==='
            sed -n '10755,10835p' index.html
            echo
            echo '=== CURRENT usages ==='
            grep -n -C 2 'getCurrencySymbol' index.html || true
          } > currency-audit-small.txt
      - name: Commit temporary audit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add currency-audit-small.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: temporary focused currency audit'
          git push
