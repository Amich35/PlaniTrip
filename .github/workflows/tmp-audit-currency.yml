name: Temporary currency helper audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit helper usages and converter context
        shell: bash
        run: |
          set -eu
          {
            echo '=== CURRENT HEAD ==='
            git rev-parse HEAD
            echo
            echo '=== getCurrencySymbol occurrences (current) ==='
            grep -n -C 8 'getCurrencySymbol' index.html || true
            echo
            echo '=== currency converter related occurrences (current) ==='
            grep -ni -C 5 -E 'converter|convertisseur|currency.*symbol|currencySymbol|exchange.*rate|taux.*change' index.html || true
            echo
            echo '=== ORIGINAL helper context at base cdfd673 ==='
            git show cdfd67347e6e043e54b4647b3431d15c68fded46:index.html | grep -n -C 12 'getCurrencySymbol' || true
          } > currency-audit.txt
      - name: Commit temporary audit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add currency-audit.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: temporary currency audit result'
          git push
