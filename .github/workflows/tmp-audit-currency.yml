name: Temporary scoped currency fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope currency symbol helper to converters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'function getConverterCurrencySymbol(c){' in text:
              print('Scoped helper already present; nothing to patch.')
              raise SystemExit(0)
          marker = 'function getCurrencySymbol(c){'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected exactly 1 getCurrencySymbol definition, found {text.count(marker)}')
          original = "function getCurrencySymbol(c){ var m=(c&&c.currency||'').match(/\\(([^)]+)\\)/); return m?m[1]:((c&&c.currency)||''); }\nfunction getConverterCurrencySymbol(c){"
          text = text.replace(marker, original, 1)
          usage = 'var localSymbol = getCurrencySymbol(c);'
          if text.count(usage) != 2:
              raise SystemExit(f'Expected exactly 2 converter localSymbol usages, found {text.count(usage)}')
          text = text.replace(usage, 'var localSymbol = getConverterCurrencySymbol(c);')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify scoped patch
        shell: bash
        run: |
          set -eu
          test "$(grep -c 'function getConverterCurrencySymbol(c)' index.html)" -eq 1
          test "$(grep -c 'var localSymbol = getConverterCurrencySymbol(c);' index.html)" -eq 2
          grep -n -C 2 'getCurrencySymbol' index.html
          grep -n -C 2 'getConverterCurrencySymbol' index.html
      - name: Commit scoped fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix: scope currency symbols to converter UI'
          git push
