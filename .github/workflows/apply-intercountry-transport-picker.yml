name: Apply intercountry transport picker
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-intercountry-transport-picker.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s' '' | base64 -d > /tmp/intercountry-transport-picker.patch
          git am /tmp/intercountry-transport-picker.patch
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-intercountry-transport-picker.yml
          git commit -m "Retire le workflow temporaire"
      - name: Push
        run: git push origin main
