name: Apply trash remainder fixes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p08c-trash-remainder.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/p08c_trash_remainder_patch.py
      - run: git diff --check
      - name: Assertions
        run: |
          grep -q "_cityTrashRemoved:true" index.html
          grep -q "if(t._cityTrashRemoved) delete _ctByKey\[_ctKey\]" index.html
          grep -q "Aucune activité prévue ce jour" index.html
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S):
            body=m.group(1)
            if not body.strip(): continue
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8')
            f.write(body); f.close()
            r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
            if r.returncode:
              print(r.stderr); sys.exit(r.returncode)
          PY
      - name: Verify empty-day trash injection
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          p=s.index('Aucune activité prévue ce jour')
          c=s[max(0,p-1800):p+3000]
          assert 'activityTrashButtonHTML(ck)' in c, 'trash helper absent from empty-day branch'
          PY
      - name: Commit
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/p08c-trash-remainder.yml .github/p08c_trash_remainder_patch.py
          git add index.html
          git commit -m "fix(P0.8-C): clear restored city trash and show empty-day trash"
          git push origin HEAD:main
