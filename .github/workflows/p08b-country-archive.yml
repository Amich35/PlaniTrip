name: Apply P0.8-B country archive
on:
  push:
    branches:
      - gpt/p08b-country-archive
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch country archive flow
        run: python .github/scripts/p08b_country_archive.py
      - name: Validate
        run: |
          git diff --check
          grep -q "async function _setTripCountryArchived" index.html
          grep -q "await _setTripCountryArchived(c.name, true)" index.html
          grep -q "await _setTripCountryArchived(countryName, false)" index.html
          python - <<'PY'
          import re,pathlib,subprocess
          h=pathlib.Path('index.html').read_text(encoding='utf-8'); n=0
          for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script>',h,flags=re.I|re.S):
              if re.search(r'\bsrc\s*=',attrs,flags=re.I): continue
              q=pathlib.Path(f'/tmp/c{n}.js'); q.write_text(body,encoding='utf-8'); subprocess.run(['node','--check',str(q)],check=True); n+=1
          if not n: raise SystemExit('no inline scripts')
          PY
      - name: Commit
        run: |
          git config user.name "PlaniTrip GPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(P0.8-B): make country archive server-authoritative"
          git push origin HEAD:gpt/p08b-country-archive
