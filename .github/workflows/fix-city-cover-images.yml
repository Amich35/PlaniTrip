name: Apply targeted city cover image fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-city-cover-images.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch city cover image selection
        run: python -c "import base64;exec(base64.b64decode('').decode())"
      - name: Validate patch
        run: git diff --check
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-city-cover-images.yml
          git add index.html
          git diff --cached --check
          git commit -m "fix: improve automatic city cover photos"
          git push
