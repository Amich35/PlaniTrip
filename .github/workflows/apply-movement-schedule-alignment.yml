name: Apply movement schedule alignment
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-movement-schedule-alignment.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align schedule fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          content = path.read_text()
          old = """.mv-schedule{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;}
          .mv-date-reset{border:none;background:transparent;color:var(--ink-muted);font:inherit;font-size:9.5px;font-weight:650;padding:5px 0 0;text-align:left;cursor:pointer;}"""
          new = """.mv-schedule{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;}
          .mv-schedule .mv-field-label,.mv-schedule .ef-input{text-align:center;}
          .mv-date-reset{width:100%;border:none;background:transparent;color:var(--ink-muted);font:inherit;font-size:9.5px;font-weight:650;padding:5px 0 0;text-align:center;cursor:pointer;}"""
          if content.count(old) != 1:
              raise SystemExit("Schedule styles not found exactly once")
          path.write_text(content.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aligne les champs de date et horaires"
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-movement-schedule-alignment.yml
          git commit -m "Retire le workflow temporaire"
      - name: Push
        run: git push origin main
